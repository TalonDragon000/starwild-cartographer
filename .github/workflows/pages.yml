name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site data
        run: |
          node scripts/validate-locations.mjs
          node scripts/validate-hints.mjs
          node scripts/validate-bot-skills.mjs
          node scripts/validate-terrain.mjs
          node --test scripts/place.test.mjs scripts/skills.test.mjs scripts/terrain.test.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          tar --exclude .git --exclude _site --exclude .github -cf - . | tar -C _site -xf -
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
